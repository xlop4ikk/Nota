<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Nota — список задач</title>
  <meta name="description" content="Nota — компактный PWA-список задач с напоминаниями. Работает офлайн, данные хранятся локально." />
  <meta name="theme-color" content="#faf7f2" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">

    <!-- ===== Header ===== -->
    <header class="header">
      <div class="brand">
        <span class="brand__logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <div class="brand__text">
          <h1 class="brand__name">Nota</h1>
          <p class="brand__tag" data-i18n="tagline">Список задач</p>
        </div>
      </div>
      <div class="header__actions">
        <div class="lang-switch" role="group" aria-label="Язык / Language">
          <button type="button" class="lang-switch__btn is-active" data-lang="ru">RU</button>
          <button type="button" class="lang-switch__btn" data-lang="en">EN</button>
        </div>
        <button type="button" id="bellBtn" class="icon-btn" data-i18n-title="notif_enable" data-i18n-aria="notif_enable" title="Включить напоминания">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.7 20a2 2 0 0 1-3.4 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span class="icon-btn__dot" hidden></span>
        </button>
      </div>
    </header>

    <!-- ===== Stats ===== -->
    <section class="stats" aria-label="Статистика">
      <div class="stat"><span class="stat__num" id="statTotal">0</span><span class="stat__label" data-i18n="stat_total">Всего</span></div>
      <div class="stat"><span class="stat__num" id="statActive">0</span><span class="stat__label" data-i18n="stat_active">Активных</span></div>
      <div class="stat"><span class="stat__num" id="statDone">0</span><span class="stat__label" data-i18n="stat_done">Готово</span></div>
    </section>

    <!-- ===== Add form ===== -->
    <form id="addForm" class="add" autocomplete="off">
      <div class="add__row">
        <input id="titleInput" class="add__input" type="text" maxlength="200" required
               data-i18n-placeholder="add_placeholder" placeholder="Новая задача…" aria-label="Новая задача" />
        <button type="button" id="toggleDetails" class="icon-btn add__more" aria-expanded="false"
                data-i18n-title="more_options" title="Параметры">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5V12l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button type="submit" class="add__btn" data-i18n-title="add_title" title="Добавить">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="addDetails" class="add__details" hidden>
        <div class="field">
          <label class="field__label" for="addDue" data-i18n="details_due">Дата и время</label>
          <input id="addDue" class="field__input" type="datetime-local" />
        </div>
        <div class="field">
          <span class="field__label" data-i18n="details_priority">Приоритет</span>
          <div class="segmented" role="radiogroup">
            <label class="segmented__opt"><input type="radio" name="addPriority" value="low" /><span data-i18n="priority_low">Низкий</span></label>
            <label class="segmented__opt"><input type="radio" name="addPriority" value="normal" checked /><span data-i18n="priority_normal">Обычный</span></label>
            <label class="segmented__opt"><input type="radio" name="addPriority" value="high" /><span data-i18n="priority_high">Высокий</span></label>
          </div>
        </div>
        <label class="switch">
          <input id="addReminder" type="checkbox" />
          <span class="switch__track"></span>
          <span class="switch__text" data-i18n="reminder">Напомнить</span>
        </label>
      </div>
    </form>

    <!-- ===== Filters & search ===== -->
    <div class="toolbar">
      <div class="filters" role="group" aria-label="Фильтр">
        <button type="button" class="chip is-active" data-filter="all" data-i18n="filter_all">Все</button>
        <button type="button" class="chip" data-filter="active" data-i18n="filter_active">Активные</button>
        <button type="button" class="chip" data-filter="done" data-i18n="filter_done">Выполненные</button>
      </div>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="searchInput" type="search" data-i18n-placeholder="search_placeholder" placeholder="Поиск" aria-label="Поиск" />
      </label>
    </div>

    <!-- ===== Task list ===== -->
    <main class="content">
      <ul id="taskList" class="tasks"></ul>
      <div id="emptyState" class="empty" hidden>
        <svg class="empty__img" viewBox="0 0 96 96" fill="none" aria-hidden="true">
          <rect x="14" y="10" width="68" height="76" rx="14" stroke="currentColor" stroke-width="3"/>
          <path d="M30 34h24M30 48h36M30 62h18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <circle cx="70" cy="66" r="16" fill="var(--accent-soft)"/>
          <path d="M63 66.5l5 5 9-10" stroke="var(--accent)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p class="empty__title" id="emptyTitle">Пока пусто</p>
        <p class="empty__text" id="emptyText">Добавьте первую задачу — она появится здесь.</p>
      </div>
    </main>
  </div>

  <!-- ===== Edit dialog ===== -->
  <dialog id="editDialog" class="dialog">
    <form id="editForm" class="dialog__form" method="dialog">
      <h2 class="dialog__title" data-i18n="edit_title">Редактировать задачу</h2>
      <div class="field">
        <label class="field__label" for="editTitle" data-i18n="field_title">Задача</label>
        <input id="editTitle" class="field__input" type="text" maxlength="200" required />
      </div>
      <div class="field">
        <label class="field__label" for="editDue" data-i18n="details_due">Дата и время</label>
        <div class="field__row">
          <input id="editDue" class="field__input" type="datetime-local" />
          <button type="button" id="clearDue" class="btn btn--ghost btn--sm" data-i18n="clear">Убрать</button>
        </div>
      </div>
      <div class="field">
        <span class="field__label" data-i18n="details_priority">Приоритет</span>
        <div class="segmented" role="radiogroup">
          <label class="segmented__opt"><input type="radio" name="editPriority" value="low" /><span data-i18n="priority_low">Низкий</span></label>
          <label class="segmented__opt"><input type="radio" name="editPriority" value="normal" /><span data-i18n="priority_normal">Обычный</span></label>
          <label class="segmented__opt"><input type="radio" name="editPriority" value="high" /><span data-i18n="priority_high">Высокий</span></label>
        </div>
      </div>
      <label class="switch">
        <input id="editReminder" type="checkbox" />
        <span class="switch__track"></span>
        <span class="switch__text" data-i18n="reminder">Напомнить</span>
      </label>
      <div class="dialog__actions">
        <button type="button" id="editDelete" class="btn btn--danger-ghost" data-i18n="delete">Удалить</button>
        <div class="dialog__actions-right">
          <button type="button" id="editCancel" class="btn btn--ghost" data-i18n="cancel">Отмена</button>
          <button type="submit" class="btn btn--primary" data-i18n="save">Сохранить</button>
        </div>
      </div>
    </form>
  </dialog>

  <!-- ===== Sync status ===== -->
  <p id="syncStatus" class="sync-status" hidden></p>

  <!-- ===== Toast ===== -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toastText"></span>
    <button type="button" id="toastAction" class="toast__action" hidden></button>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
