<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nota — заметки и задачи</title>
<meta name="description" content="Nota — заметки, задачи и списки дел с push-напоминаниями. Работает офлайн, данные хранятся на устройстве.">
<meta name="theme-color" content="#faf7f2">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== Шапка: название, счётчик активных, кнопка push ===== -->
<header class="topbar">
  <div class="topbar__brand">
    <span class="topbar__logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    <div class="topbar__text">
      <span class="topbar__name">Nota</span>
      <span class="topbar__counter">Активных: <b id="activeCount">0</b></span>
    </div>
  </div>
  <button type="button" id="pushBtn" class="iconbtn" aria-pressed="false" title="Включить напоминания">🔕</button>
</header>

<!-- ===== Поиск ===== -->
<div class="search">
  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  <input type="search" id="searchInput" placeholder="Поиск по названию и тексту" autocomplete="off" autocapitalize="sentences">
  <button type="button" id="searchClear" class="search__clear" hidden aria-label="Очистить поиск">✕</button>
</div>

<!-- ===== Список ===== -->
<main class="content">
  <h2 class="content__title" id="viewTitle">Сегодня</h2>
  <ul class="items" id="itemsList"></ul>
  <section class="empty" id="emptyState" hidden>
    <span class="empty__icon" id="emptyIcon">🗒️</span>
    <p class="empty__title" id="emptyTitle">Пока пусто</p>
    <p class="empty__text" id="emptyText">Нажмите «+», чтобы создать первую задачу.</p>
  </section>
</main>

<!-- ===== Кнопка создания ===== -->
<button type="button" class="fab" id="addBtn" aria-label="Добавить" title="Добавить">
  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
</button>

<!-- ===== Нижние вкладки ===== -->
<nav class="tabs" id="tabs" aria-label="Разделы">
  <button type="button" class="tabs__btn" data-view="today">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span>Сегодня</span>
  </button>
  <button type="button" class="tabs__btn" data-view="all">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span>Все</span>
  </button>
  <button type="button" class="tabs__btn" data-view="lists">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="4.5" cy="6.5" r="1.6" fill="currentColor"/><circle cx="4.5" cy="12" r="1.6" fill="currentColor"/><circle cx="4.5" cy="17.5" r="1.6" fill="currentColor"/></svg>
    <span>Списки</span>
  </button>
  <button type="button" class="tabs__btn" data-view="archive">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="4.5" rx="1.6" stroke="currentColor" stroke-width="1.8"/><path d="M5 9v8.5a2.5 2.5 0 0 0 2.5 2.5h9A2.5 2.5 0 0 0 19 17.5V9M10 13h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span>Архив</span>
  </button>
</nav>

<!-- ===== Нижняя шторка: создание и редактирование ===== -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet__overlay" id="sheetOverlay"></div>
  <form class="sheet__panel" id="itemForm" novalidate>
    <div class="sheet__handle" aria-hidden="true"></div>
    <h2 class="sheet__title" id="sheetTitle">Новая запись</h2>

    <div class="field">
      <span class="field__label">Тип</span>
      <div class="segmented" role="radiogroup" aria-label="Тип записи">
        <label class="segmented__opt"><input type="radio" name="fType" value="task" checked><span>Задача</span></label>
        <label class="segmented__opt"><input type="radio" name="fType" value="note"><span>Заметка</span></label>
        <label class="segmented__opt"><input type="radio" name="fType" value="list"><span>Список</span></label>
      </div>
    </div>

    <div class="field">
      <label class="field__label" for="fTitle">Название <span class="req">*</span></label>
      <input class="field__input" type="text" id="fTitle" maxlength="80" placeholder="Например: купить молоко" autocomplete="off">
    </div>

    <div class="field" id="fieldBody">
      <label class="field__label" for="fBody">Описание</label>
      <textarea class="field__input field__input--area" id="fBody" rows="3" placeholder="Подробности, ссылка, комментарий"></textarea>
    </div>

    <div class="field" id="fieldItems" hidden>
      <label class="field__label" for="fItems">Элементы списка</label>
      <textarea class="field__input field__input--area" id="fItems" rows="4" placeholder="Молоко&#10;Хлеб&#10;Кофе"></textarea>
      <span class="field__hint">По одному элементу в строке</span>
    </div>

    <div class="field field--row">
      <div class="field__half">
        <label class="field__label" for="fDate">Дата</label>
        <input class="field__input" type="date" id="fDate">
      </div>
      <div class="field__half">
        <label class="field__label" for="fTime">Время</label>
        <input class="field__input" type="time" id="fTime">
      </div>
    </div>

    <div class="field field--row">
      <div class="field__half">
        <label class="field__label" for="fRepeat">Повтор</label>
        <select class="field__input" id="fRepeat">
          <option value="none">Не повторять</option>
          <option value="daily">Каждый день</option>
          <option value="weekly">Каждую неделю</option>
          <option value="monthly">Каждый месяц</option>
        </select>
      </div>
      <div class="field__half">
        <span class="field__label">Приоритет</span>
        <div class="segmented" role="radiogroup" aria-label="Приоритет">
          <label class="segmented__opt"><input type="radio" name="fPriority" value="low"><span>Низкий</span></label>
          <label class="segmented__opt"><input type="radio" name="fPriority" value="normal" checked><span>Обычн.</span></label>
          <label class="segmented__opt"><input type="radio" name="fPriority" value="high"><span>Выс.</span></label>
        </div>
      </div>
    </div>

    <p class="sheet__error" id="sheetError" role="alert" hidden></p>

    <div class="sheet__actions">
      <button type="button" class="btn btn--ghost" id="sheetCancel">Отмена</button>
      <button type="submit" class="btn btn--primary" id="sheetSave">Сохранить</button>
    </div>
  </form>
</div>

<!-- ===== Тосты ===== -->
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="app.js"></script>
</body>
</html>
