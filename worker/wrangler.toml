# Конфигурация Cloudflare Worker для Nota.
# Перед деплоем: заполните id KV-хранилища и VAPID_PUBLIC_KEY (см. DEPLOY.md).

name = "nota-push"
main = "worker.js"
compatibility_date = "2024-09-01"

# KV создаётся одной командой:  wrangler kv namespace create NOTA
# id берётся из вывода команды.
[[kv_namespaces]]
binding = "KV_NAMESPACE"
id = "СЮДА_ВПИШИТЕ_ID_ИЗ_ВЫВОДА_wrangler_kv_namespace_create_NOTA"

# Напоминания проверяем каждую минуту.
[triggers]
crons = ["* * * * *"]

[vars]
# Контакт для VAPID-заявки, его видит push-сервис при отклонении запроса.
VAPID_SUBJECT = "mailto:you@example.com"

# Адрес PWA на GitHub Pages. Слэш на конце можно ставить — Worker срежет.
SITE_URL = "https://YOUR-LOGIN.github.io/nota/"

# Публичный ключ из `node tools/gen_vapid.js` (87 символов base64url).
VAPID_PUBLIC_KEY = "ВСТАВЬТЕ_ПУБЛИЧНЫЙ_КЛЮЧ_87_СИМВОЛОВ"

# VAPID_PRIVATE_KEY здесь быть не должен — только:
#   wrangler secret put VAPID_PRIVATE_KEY
